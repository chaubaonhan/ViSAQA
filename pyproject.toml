[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visaqa"
version = "0.1.0"
description = "Training, retrieval, inference and evaluation utilities for ViSAQA"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = [
  "torch>=2.6,<3", "transformers==4.57.1", "accelerate>=1.1,<2",
  "sentencepiece>=0.2,<0.3", "protobuf>=4", "numpy>=1.26,<3",
  "safetensors>=0.4", "sacrebleu>=2.4,<3",
  "bert-score==0.3.13"
]

[project.scripts]
visaqa = "visaqa.__main__:main"

[tool.setuptools.packages.find]
include = ["visaqa*"]
